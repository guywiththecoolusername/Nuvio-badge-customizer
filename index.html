
<style>
*{box-sizing:border-box;margin:0;padding:0}
h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

.ui-wrap{position:relative;z-index:1}

.toolbar{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:0.5px solid rgba(255,255,255,0.15);flex-wrap:wrap;background:rgba(255,255,255,0.07);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.toolbar-label{font-size:13px;font-weight:500;color:rgba(255,255,255,0.9)}
.tbtn{font-size:12px;padding:6px 13px;border:0.5px solid rgba(255,255,255,0.25);border-radius:6px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.9);cursor:pointer;transition:background 0.15s}
.tbtn:hover{background:rgba(255,255,255,0.2)}
.search{font-size:12px;padding:6px 10px;border:0.5px solid rgba(255,255,255,0.2);border-radius:6px;background:rgba(255,255,255,0.08);color:#fff;min-width:160px}
.search::placeholder{color:rgba(255,255,255,0.4)}
.search:focus{outline:none;border-color:rgba(255,255,255,0.4)}

.groups-wrap{padding:16px 18px 24px}

.group-header{font-size:11px;font-weight:500;color:rgba(255,255,255,0.5);margin:0 0 8px;display:flex;align-items:center;gap:7px;letter-spacing:0.06em;text-transform:uppercase}
.group-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.badges-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;cursor:context-menu;border-width:1.5px;border-style:solid;user-select:none;transition:transform 0.12s,box-shadow 0.12s;position:relative}
.badge:hover{transform:scale(1.06);box-shadow:0 2px 12px rgba(0,0,0,0.25)}
.badge.bordered{background:rgba(0,0,0,0.08)!important;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.badge img{width:18px;height:18px;object-fit:contain;border-radius:2px}
.badge-disabled{opacity:0.3}

.ctx-menu{position:fixed;background:rgba(20,20,30,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:0.5px solid rgba(255,255,255,0.15);border-radius:10px;padding:4px 0;min-width:190px;z-index:9999}
.ctx-menu button{display:block;width:100%;text-align:left;padding:8px 14px;font-size:13px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.88)}
.ctx-menu button:hover{background:rgba(255,255,255,0.08)}
.ctx-divider{height:0.5px;background:rgba(255,255,255,0.1);margin:4px 0}
.ctx-label{padding:5px 14px 2px;font-size:11px;color:rgba(255,255,255,0.4);font-weight:500;text-transform:uppercase;letter-spacing:0.05em}

.picker-overlay{position:fixed;inset:0;z-index:9998;background:transparent}
.picker-panel{position:fixed;background:rgba(18,18,28,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:0.5px solid rgba(255,255,255,0.15);border-radius:12px;padding:16px;z-index:10000;min-width:248px}
.picker-title{font-size:13px;font-weight:500;margin-bottom:12px;color:rgba(255,255,255,0.9)}
.picker-swatch-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:12px}
.swatch{width:24px;height:24px;border-radius:4px;cursor:pointer;border:1.5px solid transparent;transition:transform 0.1s}
.swatch:hover{transform:scale(1.18)}
.swatch.selected{border-color:#fff}
.picker-hex-row{display:flex;align-items:center;gap:8px}
.picker-hex-row input[type=color]{width:36px;height:36px;border:none;background:none;cursor:pointer;border-radius:4px}
.picker-hex-input{flex:1;font-size:13px;padding:6px 10px;border:0.5px solid rgba(255,255,255,0.2);border-radius:6px;background:rgba(255,255,255,0.07);color:#fff}
.picker-hex-input:focus{outline:none;border-color:rgba(255,255,255,0.45)}
.picker-actions{display:flex;gap:8px;margin-top:12px}
.picker-actions button{flex:1;padding:7px;font-size:13px;border-radius:6px;cursor:pointer;border:0.5px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.85)}
.picker-actions .apply{background:rgba(255,255,255,0.15);color:#fff;border-color:rgba(255,255,255,0.35)}
.picker-actions .apply:hover{background:rgba(255,255,255,0.25)}

.style-toggle{display:flex;gap:6px;margin-bottom:6px}
.style-pill{font-size:11px;padding:3px 10px;border-radius:20px;border:0.5px solid rgba(255,255,255,0.2);background:transparent;color:rgba(255,255,255,0.6);cursor:pointer;transition:all 0.15s}
.style-pill.active{background:rgba(255,255,255,0.15);color:#fff;border-color:rgba(255,255,255,0.35)}

.toast{position:fixed;bottom:20px;right:20px;background:rgba(20,20,30,0.95);backdrop-filter:blur(12px);color:rgba(255,255,255,0.9);padding:10px 16px;border-radius:8px;font-size:13px;z-index:99999;opacity:0;transform:translateY(8px);transition:all 0.25s;pointer-events:none;border:0.5px solid rgba(255,255,255,0.1)}
.toast.show{opacity:1;transform:translateY(0)}
.empty{padding:40px;text-align:center;color:rgba(255,255,255,0.35);font-size:14px}
</style>

<h2 class="sr-only">Badge color editor with animated grid background</h2>
<canvas id="bg-canvas"></canvas>

<div class="ui-wrap">
  <div class="toolbar">
    <span class="toolbar-label">Badge editor</span>
    <button class="tbtn" onclick="document.getElementById('fileInput').click()">⬆ Import JSON</button>
    <button class="tbtn" onclick="exportJSON()">⬇ Export JSON</button>
    <input class="search" type="text" placeholder="Search badges…" oninput="renderAll()" id="searchBox">
    <input type="file" id="fileInput" accept=".json" style="display:none" onchange="importFile(event)">
  </div>
  <div class="groups-wrap" id="groupsWrap"></div>
</div>

<div id="ctxMenu" class="ctx-menu" style="display:none"></div>
<div id="pickerOverlay" class="picker-overlay" style="display:none" onclick="closePicker()"></div>
<div id="pickerPanel" class="picker-panel" style="display:none"></div>
<div id="toast" class="toast"></div>

<script>
const canvas = document.getElementById('bg-canvas');
const ctx2d = canvas.getContext('2d');
let W, H, dpr;

const blooms = [
  {x:0.15, y:0.3,  r:0.55, hue:220, phase:0,    speed:0.0007},
  {x:0.75, y:0.2,  r:0.5,  hue:280, phase:2.1,  speed:0.0009},
  {x:0.5,  y:0.75, r:0.6,  hue:190, phase:4.2,  speed:0.0006},
  {x:0.85, y:0.7,  r:0.45, hue:340, phase:1.0,  speed:0.001},
  {x:0.25, y:0.85, r:0.4,  hue:160, phase:3.1,  speed:0.0008},
];

function resize(){
  dpr = 0.1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx2d.scale(dpr, dpr);
}

function drawBg(t){
  ctx2d.clearRect(0,0,W,H);
  ctx2d.fillStyle='#0d0d18';
  ctx2d.fillRect(0,0,W,H);

  blooms.forEach(b=>{
    const pulse = 0.85 + 0.15*Math.sin(t*b.speed*1.3+b.phase);
    const r = b.r * Math.min(W,H) * pulse;
    const x = b.x*W + Math.sin(t*b.speed*0.7+b.phase)*W*0.04;
    const y = b.y*H + Math.cos(t*b.speed*0.5+b.phase)*H*0.04;
    const g = ctx2d.createRadialGradient(x,y,0,x,y,r);
    const alpha = 0.13 + 0.05*Math.sin(t*b.speed+b.phase*1.3);
    g.addColorStop(0, `hsla(${b.hue},80%,65%,${alpha})`);
    g.addColorStop(0.5,`hsla(${b.hue+20},70%,55%,${alpha*0.4})`);
    g.addColorStop(1, `hsla(${b.hue+40},60%,45%,0)`);
    ctx2d.fillStyle=g;
    ctx2d.fillRect(0,0,W,H);
  });

  const gs = 40;
  ctx2d.strokeStyle='rgba(255,255,255,0.035)';
  ctx2d.lineWidth=0.5;
  for(let x=0;x<=W;x+=gs){ctx2d.beginPath();ctx2d.moveTo(x,0);ctx2d.lineTo(x,H);ctx2d.stroke()}
  for(let y=0;y<=H;y+=gs){ctx2d.beginPath();ctx2d.moveTo(0,y);ctx2d.lineTo(W,y);ctx2d.stroke()}

  ctx2d.strokeStyle='rgba(255,255,255,0.055)';
  const bs = 200;
  for(let x=0;x<=W;x+=bs){ctx2d.beginPath();ctx2d.moveTo(x,0);ctx2d.lineTo(x,H);ctx2d.stroke()}
  for(let y=0;y<=H;y+=bs){ctx2d.beginPath();ctx2d.moveTo(0,y);ctx2d.lineTo(W,y);ctx2d.stroke()}
}

let raf;
function animate(t){
  drawBg(t);
  raf=requestAnimationFrame(animate);
}
resize();
window.addEventListener('resize',()=>{ctx2d.setTransform(1,0,0,1,0,0);resize()});
requestAnimationFrame(animate);

const SWATCHES=['#FFFFFF','#F1EFE8','#D3D1C7','#888780','#444441','#2C2C2A','#111111','#000000','#E6F1FB','#B5D4F4','#85B7EB','#378ADD','#185FA5','#0C447C','#042C53','#EEEDFE','#CECBF6','#AFA9EC','#7F77DD','#534AB7','#3C3489','#26215C','#E1F5EE','#9FE1CB','#5DCAA5','#1D9E75','#0F6E56','#085041','#04342C','#EAF3DE','#C0DD97','#97C459','#639922','#3B6D11','#27500A','#173404','#FAEEDA','#FAC775','#EF9F27','#BA7517','#854F0B','#633806','#412402','#FAECE7','#F5C4B3','#F0997B','#D85A30','#993C1D','#712B13','#4A1B0C','#FBEAF0','#F4C0D1','#ED93B1','#D4537E','#993556','#72243E','#4B1528','#FCEBEB','#F7C1C1','#F09595','#E24B4A','#A32D2D','#791F1F','#501313','#FF6904','#FFBE01','#27C04F','#0095D5','#FB411C'];

let data={filters:[],groups:[]};
let pickerState={badgeId:null,prop:null,color:'#FFFFFF'};

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

function importFile(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{data=JSON.parse(ev.target.result);renderAll();showToast('Imported '+data.filters.length+' badges');}
    catch{showToast('Error parsing JSON');}
  };
  reader.readAsText(file);e.target.value='';
}

function exportJSON(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='badges.json';a.click();
  URL.revokeObjectURL(url);showToast('Exported!');
}

function getGroup(id){return data.groups.find(g=>g.id===id);}
function getBadge(id){return data.filters.find(f=>f.id===id);}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderAll(){
  const q=(document.getElementById('searchBox').value||'').toLowerCase();
  const wrap=document.getElementById('groupsWrap');
  if(!data.filters.length){wrap.innerHTML='<div class="empty">Import a JSON file or use the embedded data below…</div>';return;}

  const grouped={};
  data.groups.forEach(g=>{grouped[g.id]=[];});
  grouped['__ungrouped']=[];
  data.filters.forEach(f=>{
    if(q&&!f.name.toLowerCase().includes(q))return;
    const key=f.groupId&&grouped[f.groupId]!==undefined?f.groupId:'__ungrouped';
    grouped[key].push(f);
  });

  let html='';
  [...data.groups.map(g=>g.id),'__ungrouped'].forEach(gid=>{
    const list=grouped[gid];if(!list||!list.length)return;
    const grp=getGroup(gid);
    html+=`<div class="group-header"><span class="group-dot" style="background:${grp?grp.color:'#888'}"></span>${escHtml(grp?grp.name:'Ungrouped')}</div><div class="badges-row">`;
    list.forEach(f=>{
      const bordered=f.tagStyle==='bordered';
      const tc=f.textColor||'#fff';
      const bc=f.tagColor||'#666';
      const brd=f.borderColor||bc;
      const dis=f.isEnabled===false?' badge-disabled':'';
      const borderedClass=bordered?' bordered':'';
      let style=`color:${tc};border-color:${brd};`;
      if(!bordered)style+=`background:${bc};`;
      html+=`<span class="badge${dis}${borderedClass}" id="badge-${f.id}" style="${style}" oncontextmenu="openCtx(event,'${f.id}')">`;
      if(f.imageURL)html+=`<img src="${escHtml(f.imageURL)}" alt="" onerror="this.style.display='none'">`;
      html+=`${escHtml(f.name)}</span>`;
    });
    html+='</div>';
  });
  if(!html)html='<div class="empty">No badges match.</div>';
  wrap.innerHTML=html;
}

function openCtx(e,id){
  e.preventDefault();
  const m=document.getElementById('ctxMenu');
  const f=getBadge(id);
  const isBordered=f.tagStyle==='bordered';
  m.innerHTML=`
    <div class="ctx-label">${escHtml(f.name)}</div>
    <div class="ctx-divider"></div>
    <button onclick="openPicker('${id}','tagColor')">🎨 Tag color</button>
    <button onclick="openPicker('${id}','borderColor')">🖌 Border color</button>
    <button onclick="openPicker('${id}','textColor')">✏️ Text color</button>
    <div class="ctx-divider"></div>
    <button onclick="toggleStyle('${id}')">${isBordered?'⬛ Switch to filled':'⬜ Switch to bordered'}</button>
    <button onclick="toggleEnabled('${id}')">${f.isEnabled===false?'✅ Enable':'🚫 Disable'}</button>
  `;
  m.style.display='block';
  let x=e.clientX,y=e.clientY;
  if(x+200>window.innerWidth)x=window.innerWidth-210;
  if(y+200>window.innerHeight)y=window.innerHeight-210;
  m.style.left=x+'px';m.style.top=y+'px';
  document.addEventListener('mousedown',closeCtxOutside,{once:true});
}

function closeCtxOutside(e){
  const m=document.getElementById('ctxMenu');
  if(!m.contains(e.target))m.style.display='none';
}

function toggleStyle(id){
  document.getElementById('ctxMenu').style.display='none';
  const f=getBadge(id);if(!f)return;
  f.tagStyle=f.tagStyle==='bordered'?'filled':'bordered';
  renderAll();showToast('Style: '+f.tagStyle);
}

function toggleEnabled(id){
  document.getElementById('ctxMenu').style.display='none';
  const f=getBadge(id);if(!f)return;
  f.isEnabled=f.isEnabled===false?true:false;
  renderAll();showToast(f.isEnabled?'Enabled':'Disabled');
}

function openPicker(id,prop){
  document.getElementById('ctxMenu').style.display='none';
  const f=getBadge(id);if(!f)return;
  pickerState={badgeId:id,prop,color:f[prop]||'#ffffff'};
  const panel=document.getElementById('pickerPanel');
  const overlay=document.getElementById('pickerOverlay');
  const label={tagColor:'Tag color',borderColor:'Border color',textColor:'Text color'}[prop];

  panel.innerHTML=`
    <div class="picker-title">${label} — ${escHtml(f.name)}</div>
    <div class="picker-swatch-grid" id="swatchGrid"></div>
    <div class="picker-hex-row">
      <input type="color" id="nativePicker" value="${pickerState.color}" oninput="syncFromNative(this.value)">
      <input class="picker-hex-input" type="text" id="hexInput" value="${pickerState.color}" maxlength="7" oninput="syncFromHex(this.value)">
    </div>
    <div class="picker-actions">
      <button onclick="closePicker()">Cancel</button>
      <button class="apply" onclick="applyColor()">Apply</button>
    </div>
  `;

  const grid=panel.querySelector('#swatchGrid');
  SWATCHES.forEach(hex=>{
    const sw=document.createElement('button');
    sw.className='swatch'+(hex.toUpperCase()===pickerState.color.toUpperCase()?' selected':'');
    sw.style.background=hex;sw.title=hex;
    sw.onclick=()=>{
      pickerState.color=hex;
      panel.querySelector('#hexInput').value=hex;
      panel.querySelector('#nativePicker').value=hex;
      grid.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('selected',s.title.toUpperCase()===hex.toUpperCase()));
      previewColor(hex);
    };
    grid.appendChild(sw);
  });

  overlay.style.display='block';
  const px=Math.max(10,Math.min(window.innerWidth/2-120,window.innerWidth-260));
  const py=Math.max(10,window.innerHeight/2-160);
  panel.style.left=px+'px';panel.style.top=py+'px';
  panel.style.display='block';
}

function syncFromNative(val){pickerState.color=val;document.getElementById('hexInput').value=val;previewColor(val);}
function syncFromHex(val){if(/^#[0-9a-fA-F]{6}$/.test(val)){pickerState.color=val;document.getElementById('nativePicker').value=val;previewColor(val);}}

function previewColor(hex){
  const{badgeId,prop}=pickerState;
  const el=document.getElementById('badge-'+badgeId);if(!el)return;
  const f=getBadge(badgeId);
  if(prop==='tagColor'&&f.tagStyle!=='bordered')el.style.background=hex;
  if(prop==='borderColor')el.style.borderColor=hex;
  if(prop==='textColor')el.style.color=hex;
}

function applyColor(){
  const{badgeId,prop,color}=pickerState;
  const f=getBadge(badgeId);if(f)f[prop]=color;
  closePicker();renderAll();showToast('Color updated!');
}

function closePicker(){
  document.getElementById('pickerPanel').style.display='none';
  document.getElementById('pickerOverlay').style.display='none';
}

window.addEventListener('click',e=>{
  const ctx=document.getElementById('ctxMenu');
  if(ctx.style.display!=='none'&&!ctx.contains(e.target))ctx.style.display='none';
